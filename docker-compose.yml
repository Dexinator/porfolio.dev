services:
  # Production service - builds and runs with nginx
  portfolio-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio-production
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    profiles:
      - prod

  # Development service - runs with hot reload
  portfolio-dev:
    image: node:20-alpine
    container_name: portfolio-development
    working_dir: /app
    ports:
      - "4321:4321"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
    command: sh -c "apk add --no-cache git && npm install && npm run dev -- --host 0.0.0.0"
    restart: unless-stopped
    profiles:
      - dev
